name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /opt/apps/inverter
            
            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main
            
            # Check if package.json changed (requires rebuild)
            if git diff HEAD@{1} HEAD --name-only | grep -q "package.json\|package-lock.json\|Dockerfile"; then
              echo "🔨 Dependencies changed - full rebuild required..."
              docker compose down
              docker compose build --no-cache
              docker compose up -d
            else
              echo "♻️  Code-only changes - quick restart..."
              docker compose up -d --force-recreate --no-deps inverter inverter-poller
            fi
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            docker compose exec -T inverter npx prisma migrate deploy
            
            # Show running containers
            echo "✅ Deployment complete! Running containers:"
            docker compose ps
            
            # Show logs for verification
            echo "📋 Recent logs:"
            docker compose logs --tail=20 inverter
            docker compose logs --tail=20 inverter-poller
