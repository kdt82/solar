name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment — $(date)"

            cd /opt/apps/inverter

            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main

            # Always rebuild — Next.js bakes source code into the image at build time
            echo "🔨 Building Docker image..."
            docker compose build --no-cache

            # Bring up new containers (zero-downtime swap for unchanged services)
            echo "♻️  Restarting containers..."
            docker compose up -d --remove-orphans

            # Wait for inverter container to be healthy before running migrations
            echo "⏳ Waiting for inverter container to be ready..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Status}}' inverter 2>/dev/null || echo "missing")
              if [ "$STATUS" = "running" ]; then
                # Also check the app is actually responding
                if docker compose exec -T inverter node -e "process.exit(0)" 2>/dev/null; then
                  echo "  Container ready after ${i}×5s"
                  break
                fi
              fi
              echo "  Attempt $i/24 — status: $STATUS, waiting 5s..."
              sleep 5
            done

            # Run any pending Prisma migrations
            echo "🗄️  Running database migrations..."
            docker compose exec -T inverter npx prisma migrate deploy

            # Cleanup old images to keep disk usage in check
            echo "🧹 Pruning unused images..."
            docker image prune -f

            echo ""
            echo "✅ Deployment complete!"
            echo ""
            docker compose ps
            echo ""
            echo "📋 Recent app logs:"
            docker compose logs --tail=30 inverter

